<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">المتجر</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: '#1569C7', primaryDark: '#0F4E9C', primaryLight: '#E8F1FC' },
        fontFamily: { sans: ['Cairo', 'sans-serif'] }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { font-family: 'Cairo', sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  .hero-slide { transition: opacity 0.6s ease; }
  .cart-drawer { transition: transform 0.3s ease; }
  .toast { animation: slideIn 0.3s ease-out; }
  @keyframes slideIn { from { transform: translateY(-20px); opacity:0; } to { transform: translateY(0); opacity:1; } }
  .skeleton { background: linear-gradient(90deg,#f0f0f0 25%,#e6e6e6 50%,#f0f0f0 75%); background-size: 200% 100%; animation: shine 1.4s infinite; }
  @keyframes shine { to { background-position: -200% 0; } }
</style>
</head>
<body class="bg-white text-gray-800">

<div id="toastBox" class="fixed top-4 z-[100] flex flex-col gap-2 start-4"></div>

<!-- ============ TOP ANNOUNCEMENT BAR ============ -->
<div id="topbar" class="hidden text-center text-sm py-2 text-white"></div>

<!-- ============ HEADER ============ -->
<header class="border-b border-gray-100 sticky top-0 bg-white/95 backdrop-blur z-40">
  <div class="max-w-7xl mx-auto flex items-center justify-between px-4 py-3">
    <button id="menuBtn" class="text-2xl">&#9776;</button>
    <a href="#" id="logoLink" class="flex items-center">
      <img id="logoImg" src="" class="h-10 hidden">
      <span id="logoText" class="font-bold text-xl text-primary">المتجر</span>
    </a>
    <div class="flex items-center gap-4">
      <button id="searchBtn" class="text-xl">🔍</button>
      <button id="cartBtn" class="relative text-xl">
        🛒
        <span id="cartCount" class="absolute -top-2 -left-2 bg-primary text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">0</span>
      </button>
    </div>
  </div>
  <div id="searchBar" class="hidden px-4 pb-3">
    <input id="searchInput" type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" data-i18n-placeholder="search">
  </div>
</header>

<!-- ============ SIDE MENU ============ -->
<div id="sideMenuOverlay" class="fixed inset-0 bg-black/40 z-40 hidden"></div>
<div id="sideMenu" class="fixed top-0 bottom-0 start-0 w-72 max-w-[85vw] bg-white z-50 -translate-x-full rtl:translate-x-full transition-transform p-5 overflow-y-auto">
  <button id="closeMenuBtn" class="text-2xl mb-4">&times;</button>
  <h3 class="font-bold mb-3" data-i18n="categories">التصنيفات</h3>
  <div id="menuCategories" class="flex flex-col gap-2 mb-6"></div>
  <hr class="my-4">
  <a href="#about" class="block py-2 text-sm" data-i18n="about">من نحن</a>
  <a href="#terms" class="block py-2 text-sm" data-i18n="terms">الشروط والأحكام</a>
  <a href="#contact" class="block py-2 text-sm" data-i18n="contact">التواصل معنا</a>
</div>

<!-- ============ HERO SLIDER ============ -->
<div id="heroSlider" class="relative w-full h-56 sm:h-80 md:h-96 overflow-hidden bg-gray-100"></div>

<!-- ============ CATEGORIES ============ -->
<section class="max-w-7xl mx-auto px-4 py-8">
  <h2 class="text-xl font-bold mb-4" data-i18n="shopByCategory">تسوق حسب التصنيف</h2>
  <div id="categoriesRow" class="flex gap-4 overflow-x-auto pb-2"></div>
</section>

<!-- ============ PRODUCTS ============ -->
<section class="max-w-7xl mx-auto px-4 py-4">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-bold" data-i18n="ourProducts">منتجاتنا</h2>
    <select id="categoryFilter" class="border border-gray-200 rounded-lg px-3 py-2 text-sm">
      <option value="all" data-i18n="all">الكل</option>
    </select>
  </div>
  <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
</section>

<!-- ============ FOOTER ============ -->
<footer class="bg-gray-900 text-gray-300 mt-12">
  <div class="max-w-7xl mx-auto px-4 py-10 grid sm:grid-cols-3 gap-8">
    <div id="about">
      <h4 class="text-white font-bold mb-3" data-i18n="about">من نحن</h4>
      <div id="footerAbout" class="text-sm leading-6"></div>
    </div>
    <div id="terms">
      <h4 class="text-white font-bold mb-3" data-i18n="terms">الشروط والأحكام</h4>
      <div id="footerTerms" class="text-sm leading-6"></div>
    </div>
    <div id="contact">
      <h4 class="text-white font-bold mb-3" data-i18n="contact">التواصل معنا</h4>
      <div id="footerContact" class="text-sm leading-6 mb-3"></div>
      <div class="flex gap-3">
        <a id="socialFacebook" href="#" target="_blank" class="hidden hover:text-primary">Facebook</a>
        <a id="socialInstagram" href="#" target="_blank" class="hidden hover:text-primary">Instagram</a>
        <a id="socialTiktok" href="#" target="_blank" class="hidden hover:text-primary">TikTok</a>
        <a id="socialWhatsapp" href="#" target="_blank" class="hidden hover:text-primary">WhatsApp</a>
      </div>
    </div>
  </div>
  <div class="text-center text-xs text-gray-500 border-t border-gray-800 py-4" data-i18n="rights">جميع الحقوق محفوظة</div>
</footer>

<!-- ============ CART DRAWER ============ -->
<div id="cartOverlay" class="fixed inset-0 bg-black/40 z-50 hidden"></div>
<div id="cartDrawer" class="cart-drawer fixed top-0 bottom-0 end-0 w-full sm:w-96 max-w-[100vw] bg-white z-50 translate-x-full rtl:-translate-x-full flex flex-col">
  <div class="flex items-center justify-between p-4 border-b border-gray-100">
    <h3 class="font-bold" data-i18n="yourCart">سلة التسوق</h3>
    <button id="closeCartBtn" class="text-2xl">&times;</button>
  </div>
  <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
  <div class="border-t border-gray-100 p-4">
    <div id="cartTotals" class="space-y-1 mb-2"></div>
    <div class="flex justify-between font-bold mb-4 pt-2 border-t border-gray-100">
      <span data-i18n="total">الإجمالي</span>
      <span id="cartTotal">0</span>
    </div>
    <button id="checkoutBtn" class="w-full bg-primary text-white py-3 rounded-lg font-semibold" data-i18n="checkout">إتمام الطلب</button>
  </div>
</div>

<!-- ============ CHECKOUT MODAL ============ -->
<div id="checkoutModal" class="fixed inset-0 bg-black/50 z-[60] hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-md p-6">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-lg" data-i18n="completeOrder">إتمام الطلب (الدفع عند الاستلام)</h3>
      <button id="closeCheckoutModal" class="text-2xl">&times;</button>
    </div>
    <div class="space-y-3">
      <input id="custName" type="text" data-i18n-placeholder="fullName" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
      <input id="custPhone" type="tel" data-i18n-placeholder="phone" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
      <input id="custCity" type="text" data-i18n-placeholder="city" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
      <textarea id="custAddress" data-i18n-placeholder="address" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" rows="2"></textarea>
    </div>
    <button id="confirmOrderBtn" class="w-full bg-primary text-white py-3 rounded-lg font-semibold mt-4" data-i18n="confirmOrder">تأكيد الطلب</button>
  </div>
</div>

<!-- ============ FIREBASE + APP LOGIC ============ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, onSnapshot, getDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== يجب أن تكون نفس بيانات Firebase المستخدمة في admin.html ======
const firebaseConfig = {
  apiKey: "AIzaSyB7O7xrjJVgeslAGYoCZYnKqWG5s--FdkI",
  authDomain: "choes-7f98c.firebaseapp.com",
  projectId: "choes-7f98c",
  storageBucket: "choes-7f98c.firebasestorage.app",
  messagingSenderId: "149286991385",
  appId: "1:149286991385:web:adee6beae7e3ad80c2dc88"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ---------- i18n ----------
const dict = {
  ar: {
    search: 'ابحث عن منتج...', categories: 'التصنيفات', about: 'من نحن', terms: 'الشروط والأحكام',
    contact: 'التواصل معنا', shopByCategory: 'تسوق حسب التصنيف', ourProducts: 'منتجاتنا', all: 'الكل',
    yourCart: 'سلة التسوق', total: 'الإجمالي', checkout: 'إتمام الطلب', completeOrder: 'إتمام الطلب (الدفع عند الاستلام)',
    fullName: 'الاسم الكامل', phone: 'رقم الهاتف', city: 'المدينة', address: 'العنوان بالتفصيل',
    confirmOrder: 'تأكيد الطلب', rights: 'جميع الحقوق محفوظة', addToCart: 'أضف إلى السلة',
    emptyCart: 'سلتك فارغة', orderSuccess: 'تم إرسال طلبك بنجاح! سنتواصل معك قريباً', fillFields: 'الرجاء ملء جميع الحقول',
    size: 'المقاس', color: 'اللون', noProducts: 'لا توجد منتجات في هذا التصنيف',
    outOfStock: 'نفذت الكمية', subtotal: 'المجموع الفرعي', delivery: 'التوصيل',
    onlyLeft: 'باقي غير', pieces: 'قطعة'
  },
  fr: {
    search: 'Rechercher un produit...', categories: 'Catégories', about: 'À propos', terms: 'Conditions générales',
    contact: 'Contact', shopByCategory: 'Acheter par catégorie', ourProducts: 'Nos produits', all: 'Tous',
    yourCart: 'Votre panier', total: 'Total', checkout: 'Commander', completeOrder: 'Finaliser (Paiement à la livraison)',
    fullName: 'Nom complet', phone: 'Téléphone', city: 'Ville', address: 'Adresse détaillée',
    confirmOrder: 'Confirmer la commande', rights: 'Tous droits réservés', addToCart: 'Ajouter au panier',
    emptyCart: 'Votre panier est vide', orderSuccess: 'Commande envoyée avec succès !', fillFields: 'Veuillez remplir tous les champs',
    size: 'Taille', color: 'Couleur', noProducts: 'Aucun produit dans cette catégorie',
    outOfStock: 'Rupture de stock', subtotal: 'Sous-total', delivery: 'Livraison',
    onlyLeft: 'Il ne reste que', pieces: 'pièce(s)'
  },
  en: {
    search: 'Search for a product...', categories: 'Categories', about: 'About Us', terms: 'Terms & Conditions',
    contact: 'Contact Us', shopByCategory: 'Shop by category', ourProducts: 'Our Products', all: 'All',
    yourCart: 'Your Cart', total: 'Total', checkout: 'Checkout', completeOrder: 'Complete Order (Cash on Delivery)',
    fullName: 'Full Name', phone: 'Phone Number', city: 'City', address: 'Detailed Address',
    confirmOrder: 'Confirm Order', rights: 'All rights reserved', addToCart: 'Add to Cart',
    emptyCart: 'Your cart is empty', orderSuccess: 'Your order was sent successfully!', fillFields: 'Please fill all fields',
    size: 'Size', color: 'Color', noProducts: 'No products in this category',
    outOfStock: 'Out of stock', subtotal: 'Subtotal', delivery: 'Delivery',
    onlyLeft: 'Only', pieces: 'left'
  }
};
let currentLang = 'ar';
let currentCurrency = 'MAD';
let deliveryFee = 0;
const currencySymbols = { MAD: 'د.م.', USD: '$', SAR: 'ر.س', EUR: '€' };

function loadCartFromStorage() {
  try { return JSON.parse(localStorage.getItem('storeCart') || '[]'); }
  catch (e) { return []; }
}
function saveCartToStorage() {
  localStorage.setItem('storeCart', JSON.stringify(cart));
}

function t(key) { return dict[currentLang]?.[key] || dict.ar[key] || key; }

function applyLang() {
  document.getElementById('htmlRoot').lang = currentLang;
  document.getElementById('htmlRoot').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
  const catAllOpt = document.querySelector('#categoryFilter option[value="all"]');
  if (catAllOpt) catAllOpt.textContent = t('all');
}

function formatPrice(v) {
  return `${(v || 0).toLocaleString('en-US')} ${currencySymbols[currentCurrency] || ''}`;
}

function toast(msg, type = 'success') {
  const box = document.getElementById('toastBox');
  const el = document.createElement('div');
  el.className = `toast px-4 py-3 rounded-lg shadow-lg text-sm text-white ${type === 'success' ? 'bg-green-600' : 'bg-red-500'}`;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ---------- SETTINGS (realtime) ----------
onSnapshot(doc(db, 'settings', 'store'), snap => {
  if (!snap.exists()) return;
  const s = snap.data();

  currentLang = s.language || 'ar';
  currentCurrency = s.currency || 'MAD';
  deliveryFee = Number(s.deliveryFee) || 0;
  applyLang();
  renderProducts(); // re-render with correct currency
  renderCart(); // re-render cart totals with correct currency/delivery fee

  // topbar
  const topbar = document.getElementById('topbar');
  if (s.topbar?.active && s.topbar?.text) {
    topbar.textContent = s.topbar.text;
    topbar.style.backgroundColor = s.topbar.color || '#1569C7';
    topbar.classList.remove('hidden');
  } else {
    topbar.classList.add('hidden');
  }

  // logo
  if (s.logo) {
    document.getElementById('logoImg').src = s.logo;
    document.getElementById('logoImg').classList.remove('hidden');
    document.getElementById('logoText').classList.add('hidden');
  }

  // hero slider
  renderHero(s.heroSlides || []);

  // footer
  document.getElementById('footerAbout').innerHTML = s.footer?.about || '';
  document.getElementById('footerTerms').innerHTML = s.footer?.terms || '';
  document.getElementById('footerContact').innerHTML = s.footer?.contact || '';

  const social = s.footer?.social || {};
  setupSocialLink('socialFacebook', social.facebook);
  setupSocialLink('socialInstagram', social.instagram);
  setupSocialLink('socialTiktok', social.tiktok);
  if (social.whatsapp) {
    const a = document.getElementById('socialWhatsapp');
    a.href = `https://wa.me/${social.whatsapp}`;
    a.classList.remove('hidden');
  }
});

function setupSocialLink(id, url) {
  if (!url) return;
  const a = document.getElementById(id);
  a.href = url;
  a.classList.remove('hidden');
}

let heroInterval;
function renderHero(slides) {
  const container = document.getElementById('heroSlider');
  clearInterval(heroInterval);
  if (!slides.length) { container.innerHTML = ''; return; }
  container.innerHTML = slides.map((url, i) => `
    <img src="${url}" class="hero-slide absolute inset-0 w-full h-full object-cover ${i === 0 ? 'opacity-100' : 'opacity-0'}" data-i="${i}">
  `).join('');
  let idx = 0;
  if (slides.length > 1) {
    heroInterval = setInterval(() => {
      const imgs = container.querySelectorAll('.hero-slide');
      imgs[idx].classList.replace('opacity-100', 'opacity-0');
      idx = (idx + 1) % imgs.length;
      imgs[idx].classList.replace('opacity-0', 'opacity-100');
    }, 4000);
  }
}

// ---------- CATEGORIES (realtime) ----------
let allCategories = [];
onSnapshot(collection(db, 'categories'), snap => {
  allCategories = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.active);
  renderCategoriesUI();
});

function renderCategoriesUI() {
  document.getElementById('categoriesRow').innerHTML = allCategories.map(c => `
    <button class="cat-card flex-shrink-0 w-28 text-center" data-id="${c.id}">
      <img src="${c.image || 'https://placehold.co/150x150?text=%20'}" class="w-24 h-24 object-cover rounded-full mx-auto border border-gray-100">
      <p class="text-xs mt-2 font-medium">${c.name}</p>
    </button>
  `).join('');

  document.getElementById('menuCategories').innerHTML = allCategories.map(c =>
    `<button class="cat-card-menu text-sm text-start py-1" data-id="${c.id}">${c.name}</button>`
  ).join('');

  const filterSel = document.getElementById('categoryFilter');
  filterSel.innerHTML = `<option value="all">${t('all')}</option>` + allCategories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

  document.querySelectorAll('.cat-card, .cat-card-menu').forEach(b => {
    b.addEventListener('click', () => {
      document.getElementById('categoryFilter').value = b.dataset.id;
      renderProducts();
      closeSideMenu();
      document.getElementById('productsGrid').scrollIntoView({ behavior: 'smooth' });
    });
  });
}

document.getElementById('categoryFilter').addEventListener('change', renderProducts);

// ---------- PRODUCTS (realtime) ----------
let allProducts = [];
onSnapshot(collection(db, 'products'), snap => {
  allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderProducts();
});

let searchTerm = '';

function renderProducts() {
  const catFilter = document.getElementById('categoryFilter').value;
  let list = allProducts;
  if (catFilter && catFilter !== 'all') list = list.filter(p => p.categoryId === catFilter);
  if (searchTerm) list = list.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()));

  const grid = document.getElementById('productsGrid');
  grid.innerHTML = list.map(p => {
    const outOfStock = typeof p.stock === 'number' && p.stock <= 0;
    return `
    <a href="product.html?id=${p.id}" class="product-card group block ${outOfStock ? 'opacity-60' : ''}" data-id="${p.id}">
      <div class="relative overflow-hidden rounded-xl bg-gray-50 aspect-square">
        <img src="${(p.images && p.images[0]) || 'https://placehold.co/300x300?text=%20'}" class="w-full h-full object-cover group-hover:scale-105 transition">
        ${p.oldPrice && !outOfStock ? `<span class="absolute top-2 start-2 bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full">SALE</span>` : ''}
        ${outOfStock ? `<span class="absolute top-2 start-2 bg-gray-700 text-white text-[10px] px-2 py-0.5 rounded-full">${t('outOfStock')}</span>` : ''}
      </div>
      <h4 class="text-sm mt-2 font-medium line-clamp-1">${p.name}</h4>
      <div class="flex items-center gap-2 mt-1">
        <span class="text-primary font-bold text-sm">${formatPrice(p.price)}</span>
        ${p.oldPrice ? `<span class="text-gray-400 line-through text-xs">${formatPrice(p.oldPrice)}</span>` : ''}
      </div>
    </a>
  `; }).join('') || `<p class="col-span-full text-center text-gray-400 py-10">${t('noProducts')}</p>`;
}

document.getElementById('searchBtn').addEventListener('click', () => document.getElementById('searchBar').classList.toggle('hidden'));
document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value; renderProducts(); });

// ---------- CART ----------
let cart = loadCartFromStorage();

function addToCart(product, variant) {
  const existing = cart.find(i => i.productId === product.id &&
    (i.variant?.size || null) === (variant?.size || null) &&
    (i.variant?.color || null) === (variant?.color || null));
  const stockLimit = typeof product.stock === 'number' ? product.stock : Infinity;
  if (existing) {
    if (existing.qty >= stockLimit) return toast(t('onlyLeft') + ' ' + stockLimit + ' ' + t('pieces'), 'error');
    existing.qty++;
  } else {
    if (stockLimit <= 0) return toast(t('outOfStock'), 'error');
    cart.push({
      productId: product.id, name: product.name, price: product.price,
      image: (product.images && product.images[0]) || '', qty: 1, variant, stock: (typeof product.stock === 'number' ? product.stock : null)
    });
  }
  renderCart();
  toast(t('addToCart') + ' ✓');
}

function renderCart() {
  saveCartToStorage();
  document.getElementById('cartCount').textContent = cart.reduce((s, i) => s + i.qty, 0);
  const container = document.getElementById('cartItems');
  container.innerHTML = cart.map((item, i) => `
    <div class="flex gap-3 items-center border-b border-gray-50 pb-3">
      <img src="${item.image || 'https://placehold.co/60x60?text=%20'}" class="w-14 h-14 object-cover rounded-lg">
      <div class="flex-1">
        <p class="text-sm font-medium">${item.name}</p>
        <p class="text-xs text-gray-400">${[item.variant?.size, item.variant?.color].filter(Boolean).join(' / ')}</p>
        <div class="flex items-center gap-2 mt-1">
          <button class="qty-minus w-6 h-6 border border-gray-200 rounded" data-i="${i}">-</button>
          <span class="text-sm">${item.qty}</span>
          <button class="qty-plus w-6 h-6 border border-gray-200 rounded" data-i="${i}">+</button>
        </div>
      </div>
      <div class="text-end">
        <p class="text-sm font-bold text-primary">${formatPrice(item.price * item.qty)}</p>
        <button class="remove-item text-xs text-red-500 mt-1" data-i="${i}">✕</button>
      </div>
    </div>
  `).join('') || `<p class="text-gray-400 text-center py-10">${t('emptyCart')}</p>`;

  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const fee = cart.length ? deliveryFee : 0;
  const total = subtotal + fee;
  const totalsBox = document.getElementById('cartTotals');
  if (totalsBox) {
    totalsBox.innerHTML = `
      <div class="flex justify-between text-sm text-gray-500"><span>${t('subtotal')}</span><span>${formatPrice(subtotal)}</span></div>
      <div class="flex justify-between text-sm text-gray-500"><span>${t('delivery')}</span><span>${formatPrice(fee)}</span></div>
    `;
  }
  document.getElementById('cartTotal').textContent = formatPrice(total);

  document.querySelectorAll('.qty-plus').forEach(b => b.addEventListener('click', () => {
    const item = cart[b.dataset.i];
    const stockLimit = typeof item.stock === 'number' ? item.stock : Infinity;
    if (item.qty >= stockLimit) return toast(t('onlyLeft') + ' ' + stockLimit + ' ' + t('pieces'), 'error');
    item.qty++; renderCart();
  }));
  document.querySelectorAll('.qty-minus').forEach(b => b.addEventListener('click', () => { const i = b.dataset.i; cart[i].qty = Math.max(1, cart[i].qty - 1); renderCart(); }));
  document.querySelectorAll('.remove-item').forEach(b => b.addEventListener('click', () => { cart.splice(b.dataset.i, 1); renderCart(); }));
}

document.getElementById('cartBtn').addEventListener('click', () => {
  document.getElementById('cartDrawer').classList.remove('translate-x-full', '-translate-x-full');
  document.getElementById('cartOverlay').classList.remove('hidden');
});
function closeCart() {
  document.getElementById('cartDrawer').classList.add(currentLang === 'ar' ? '-translate-x-full' : 'translate-x-full');
  document.getElementById('cartOverlay').classList.add('hidden');
}
document.getElementById('closeCartBtn').addEventListener('click', closeCart);
document.getElementById('cartOverlay').addEventListener('click', closeCart);

// ---------- SIDE MENU ----------
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sideMenu').classList.remove('-translate-x-full', 'translate-x-full');
  document.getElementById('sideMenuOverlay').classList.remove('hidden');
});
function closeSideMenu() {
  document.getElementById('sideMenu').classList.add(currentLang === 'ar' ? 'translate-x-full' : '-translate-x-full');
  document.getElementById('sideMenuOverlay').classList.add('hidden');
}
document.getElementById('closeMenuBtn').addEventListener('click', closeSideMenu);
document.getElementById('sideMenuOverlay').addEventListener('click', closeSideMenu);

// ---------- CHECKOUT ----------
document.getElementById('checkoutBtn').addEventListener('click', () => {
  if (!cart.length) return toast(t('emptyCart'), 'error');
  document.getElementById('checkoutModal').classList.remove('hidden');
  document.getElementById('checkoutModal').classList.add('flex');
});
document.getElementById('closeCheckoutModal').addEventListener('click', () => {
  document.getElementById('checkoutModal').classList.add('hidden');
});

document.getElementById('confirmOrderBtn').addEventListener('click', async () => {
  const fullName = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const city = document.getElementById('custCity').value.trim();
  const address = document.getElementById('custAddress').value.trim();

  if (!fullName || !phone || !city || !address) return toast(t('fillFields'), 'error');

  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const total = subtotal + deliveryFee;
  const orderNumber = Date.now().toString().slice(-8);
  const btn = document.getElementById('confirmOrderBtn');
  btn.disabled = true;

  try {
    await addDoc(collection(db, 'orders'), {
      orderNumber,
      customer: { fullName, phone, city, address },
      items: cart,
      subtotal,
      deliveryFee,
      total,
      status: 'pending',
      createdAt: serverTimestamp()
    });
    toast(t('orderSuccess'));
    cart = [];
    localStorage.removeItem('storeCart');
    renderCart();
    document.getElementById('checkoutModal').classList.add('hidden');
    closeCart();
    ['custName', 'custPhone', 'custCity', 'custAddress'].forEach(id => document.getElementById(id).value = '');
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  }
  btn.disabled = false;
});

applyLang();
</script>
</body>
</html>
